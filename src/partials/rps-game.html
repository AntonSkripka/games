<section class="rps-game" data-section="game">
	<div class="container">
		<h2 class="rps-game__title">Камінь - ножиці - папір</h2>

		<div class="rps-game__wrapper">
			<div class="rps-game__choice">
				<ul class="rps-game__choice-list" id="playerList">
					<li class="rps-game__choice--item rock" id="rock">
						<img src="./images/stone.svg" alt="stone" id="rock"/>
					</li>
					<li class="rps-game__choice--item scissors" id="scissors">
						<img src="./images/scissors.svg" alt="scissors" id="scissors"/>
					</li>
					<li class="rps-game__choice--item paper" id="paper">
						<img src="./images/paper.svg" alt="paper" id="paper"/>
					</li>
				</ul>
				<ul class="rps-game__score">
					<li class="rps-game__score-item">Рахунок:</li>
					<li class="rps-game__score-item">
						Комп’ютер - <span class="computer-score">0</span>
					</li>
					<li class="rps-game__score-item">
						Ви - <span class="player-score">0</span>
					</li>
				</ul>
				<span class="rps-game__status">Ви виграли раунд!</span>

				<button class="rps-game__btn">Варіант комп’ютера</button>
			</div>
		</div>
	</div>
</section>
