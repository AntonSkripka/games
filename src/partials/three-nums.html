<section class="biggest-num" data-section="numeral">
  <div class="container">
    <h2 class="biggest-num__title">Введіть 3 числа</h2>
    <form class="biggest-num__inputs-form">
      <input class="biggest-num__input input-left" type="number" placeholder="Введіть число">
      <input class="biggest-num__input input-right" type="number" placeholder="Введіть число">
      <input class="biggest-num__input input-bottom" type="number" placeholder="Введіть число">
    </form>
    <span class="biggest-num__span">Найбільше число, яке ви ввели:  <strong class="biggest-num__max-val">(число)</strong></span>
    
    <div class="biggest-num__chart" id="threeNumChart"></div>
  </div>
</section>
